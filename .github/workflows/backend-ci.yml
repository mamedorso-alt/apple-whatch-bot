name: backend-ci

on:
  push:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: productivity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d productivity_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      APP_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/productivity_test
      TELEGRAM_BOT_TOKEN: test_token
      TELEGRAM_WEBHOOK_SECRET: test_webhook_secret
      JWT_SECRET: test_internal_secret
      DEFAULT_TIMEZONE: Asia/Baku
      MORNING_SEND_HOUR: 8
      MORNING_SEND_MINUTE: 30
      EVENING_SEND_HOUR: 20
      EVENING_SEND_MINUTE: 30
      LINK_CODE_TTL_MIN: 15
      SCHEDULER_ENABLED: false
      SCHEDULER_INTERVAL_MIN: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
