version: "3.9"

services:
  db_test:
    image: postgres:16
    container_name: productivity_db_test
    environment:
      POSTGRES_DB: productivity_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productivity_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  test_runner:
    build:
      context: .
    container_name: productivity_test_runner
    env_file:
      - .env.test
    depends_on:
      db_test:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             pytest -q"
