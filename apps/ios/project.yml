name: ProductivityAssistant
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.productivity.assistant
    SWIFT_VERSION: 5.9
targets:
  ProductivityAssistant:
    type: application
    platform: iOS
    sources:
      - path: ProductivityAssistant
    info:
      path: ProductivityAssistant/Info.plist
      properties:
        UILaunchScreen: {}
        API_BASE_URL: http://localhost:8000
        NSHealthShareUsageDescription: App reads Health data to build daily productivity insights and Telegram reports.
        NSHealthUpdateUsageDescription: Reserved for future features. Current MVP uses read-only HealthKit access.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ProductivityAssistant/ProductivityAssistant.entitlements
    dependencies: []
schemes:
  ProductivityAssistant:
    build:
      targets:
        ProductivityAssistant: all
    run:
      config: Debug
    archive:
      config: Release
